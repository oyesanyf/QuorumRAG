name: QuorumRAG Cross-Platform Installers & SLSA Release

on:
  push:
    tags:
      - 'quorumrag-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.6.11)'
        required: false
        default: '0.6.11'

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"

jobs:
  # 1. Windows x86_64 Native MSVC + WiX v5 MSI + Zero-Touch PATH Audit
  build-windows:
    name: Windows x64 (.msi & .zip)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout commit
        shell: bash
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin "$REPO_URL"
          git -c protocol.version=2 fetch --no-tags --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD

      - name: Ensure protoc & WiX v5
        shell: pwsh
        run: |
          if (-not (Get-Command protoc -ErrorAction SilentlyContinue)) {
            choco install protoc --no-progress -y
          }
          try { dotnet tool install --global wix --version 5.0.2 } catch {}
          $wixVer = & "$env:USERPROFILE\.dotnet\tools\wix.exe" --version
          Write-Host "WiX version: $wixVer"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          workspaces: .
          key: quorumrag-windows-msvc

      - name: Build Windows Release & WiX v5 MSI Package
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;C:\ProgramData\chocolatey\bin;$env:PATH"
          $ver = if ($env:REF_NAME -like "quorumrag-v*") { $env:REF_NAME.Substring(11) } elseif ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { "0.6.11" }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -Version $ver -SkipDefenderScan
          $msi = "deploy\windows\QuorumRAG-$ver-x86_64.msi"
          $zip = "deploy\windows\QuorumRAG-$ver-windows-x86_64.zip"
          if (-not (Test-Path $msi)) { throw "Missing expected MSI at $msi" }
          if (-not (Test-Path $zip)) { throw "Missing expected ZIP at $zip" }
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" msi validate -ice ICE03 -ice ICE18 -ice ICE27 -ice ICE63 $msi
          if ($LASTEXITCODE -ne 0) { throw "WiX MSI ICE validation (ICE03/ICE18/ICE27/ICE63) failed with exit code $LASTEXITCODE" }
          & "target\release\quorumrag.exe" --version
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          python -X utf8 scripts/verify_live_test_queries.py --bin "target\release\quorumrag.exe"
          if ($LASTEXITCODE -ne 0) { throw "Live HTTP /api/query E2E verification failed on Windows x64" }

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: quorumrag-windows-x64
          path: |
            deploy/windows/*.msi
            deploy/windows/*.zip
          if-no-files-found: error

  # 2. Linux x86_64 Native Build & Multi-Format Packaging (.deb, .rpm, .tar.gz)
  build-linux-x64:
    name: Linux x64 (.deb, .rpm, .tar.gz)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout commit
        shell: bash
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin "$REPO_URL"
          git -c protocol.version=2 fetch --no-tags --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD

      - name: Install System Build & Packaging Dependencies
        run: |
          set -euo pipefail
          MISSING_APT=()
          command -v rpmbuild >/dev/null 2>&1 || MISSING_APT+=(rpm)
          command -v dpkg-deb >/dev/null 2>&1 || MISSING_APT+=(dpkg-dev)
          command -v pkg-config >/dev/null 2>&1 || MISSING_APT+=(pkg-config)
          pkg-config --exists openssl || MISSING_APT+=(libssl-dev)
          if [ "${#MISSING_APT[@]}" -gt 0 ]; then
            sudo apt-get update -o Acquire::Retries=3 || true
            sudo apt-get install -y --fix-missing "${MISSING_APT[@]}"
          fi
          if ! command -v cmake >/dev/null 2>&1; then
            curl -fsSL "https://github.com/Kitware/CMake/releases/download/v3.31.5/cmake-3.31.5-linux-x86_64.tar.gz" -o /tmp/cmake.tar.gz
            echo "2984e70515ff60c5e4a41922b5d715a8168a696a89721e3b114e36f453244f72  /tmp/cmake.tar.gz" | sha256sum -c -
            sudo tar -xzf /tmp/cmake.tar.gz -C /usr/local --strip-components=1
            rm -f /tmp/cmake.tar.gz
          fi
          if ! command -v protoc >/dev/null 2>&1; then
            curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip" -o /tmp/protoc.zip
            echo "3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a  /tmp/protoc.zip" | sha256sum -c -
            sudo python3 -m zipfile -e /tmp/protoc.zip /usr/local
            sudo chmod 755 /usr/local/bin/protoc
            rm -f /tmp/protoc.zip
          fi
          if ! command -v clang >/dev/null 2>&1; then
            CAND_CLANG=$(ls -1 /usr/bin/clang-[0-9]* /usr/lib/llvm-*/bin/clang 2>/dev/null | head -n 1 || true)
            if [ -n "${CAND_CLANG}" ]; then
              sudo ln -sf "${CAND_CLANG}" /usr/local/bin/clang
            fi
          fi
          echo "Verified Linux x64 build tools: $(rpmbuild --version), $(dpkg-deb --version | head -n1), $(cmake --version | head -n1), $(protoc --version)"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          workspaces: .
          key: quorumrag-linux-x64

      - name: Verify Workspace Compilation & v0.6.11 Regression Suites
        run: |
          cargo check --workspace --all-targets
          cargo test -p quorum-types --lib
          cargo test -p quorum-storage --lib
          cargo test -p quorum-coordinator --test regression_angela_davis_disambiguation -- --nocapture
          cargo test -p quorum-daemon --test regression_dns_forensic_routing -- --nocapture

      - name: Build, Live-Query E2E Verify & Package Linux x64 (.deb, .rpm, .tar.gz)
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-0.6.11}"
          if [[ "${REF_NAME}" == quorumrag-v* ]]; then VERSION="${REF_NAME#quorumrag-v}"; fi
          cargo build --release -p quorum-daemon --bin quorumrag
          ./target/release/quorumrag --version
          python3 scripts/verify_live_test_queries.py --bin ./target/release/quorumrag
          bash packaging/linux/build_packages.sh target/release/quorumrag "${VERSION}" amd64 deploy/linux quorumrag
          dpkg-deb --info "deploy/linux/quorumrag_${VERSION}_amd64.deb"
          rpm -qip "deploy/linux/quorumrag-${VERSION}-1.x86_64.rpm"

      - name: Upload Linux x64 Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: quorumrag-linux-x64
          path: deploy/linux/*
          if-no-files-found: error

  # 3. Linux ARM64 Native Build & Multi-Format Packaging (.deb, .rpm, .tar.gz)
  build-linux-arm64:
    name: Linux ARM64 (.deb, .rpm, .tar.gz)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout commit
        shell: bash
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin "$REPO_URL"
          git -c protocol.version=2 fetch --no-tags --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD

      - name: Install System Build & Packaging Dependencies
        run: |
          set -euo pipefail
          MISSING_APT=()
          command -v rpmbuild >/dev/null 2>&1 || MISSING_APT+=(rpm)
          command -v dpkg-deb >/dev/null 2>&1 || MISSING_APT+=(dpkg-dev)
          command -v pkg-config >/dev/null 2>&1 || MISSING_APT+=(pkg-config)
          pkg-config --exists openssl || MISSING_APT+=(libssl-dev)
          if [ "${#MISSING_APT[@]}" -gt 0 ]; then
            sudo apt-get update -o Acquire::Retries=3 || true
            sudo apt-get install -y --fix-missing "${MISSING_APT[@]}"
          fi
          if ! command -v cmake >/dev/null 2>&1; then
            curl -fsSL "https://github.com/Kitware/CMake/releases/download/v3.31.5/cmake-3.31.5-linux-aarch64.tar.gz" -o /tmp/cmake.tar.gz
            echo "eb92af175ea91e3706ff62484088c3a3774ef3e1a8c399111785dd5f47010164  /tmp/cmake.tar.gz" | sha256sum -c -
            sudo tar -xzf /tmp/cmake.tar.gz -C /usr/local --strip-components=1
            rm -f /tmp/cmake.tar.gz
          fi
          if ! command -v protoc >/dev/null 2>&1; then
            curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-aarch_64.zip" -o /tmp/protoc.zip
            echo "6427349140e01f06e049e707a58709a4f221ae73ab9a0425bc4a00c8d0e1ab32  /tmp/protoc.zip" | sha256sum -c -
            sudo python3 -m zipfile -e /tmp/protoc.zip /usr/local
            sudo chmod 755 /usr/local/bin/protoc
            rm -f /tmp/protoc.zip
          fi
          if ! command -v clang >/dev/null 2>&1; then
            CAND_CLANG=$(ls -1 /usr/bin/clang-[0-9]* /usr/lib/llvm-*/bin/clang 2>/dev/null | head -n 1 || true)
            if [ -n "${CAND_CLANG}" ]; then
              sudo ln -sf "${CAND_CLANG}" /usr/local/bin/clang
            fi
          fi
          echo "Verified Linux ARM64 build tools: $(rpmbuild --version), $(dpkg-deb --version | head -n1), $(cmake --version | head -n1), $(protoc --version)"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          workspaces: .
          key: quorumrag-linux-arm64

      - name: Build & Package Linux ARM64 (.deb, .rpm, .tar.gz)
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-0.6.11}"
          if [[ "${REF_NAME}" == quorumrag-v* ]]; then VERSION="${REF_NAME#quorumrag-v}"; fi
          cargo build --release -p quorum-daemon --bin quorumrag
          ./target/release/quorumrag --version
          bash packaging/linux/build_packages.sh target/release/quorumrag "${VERSION}" arm64 deploy/linux-arm64 quorumrag
          dpkg-deb --info "deploy/linux-arm64/quorumrag_${VERSION}_arm64.deb"
          rpm -qip "deploy/linux-arm64/quorumrag-${VERSION}-1.aarch64.rpm"

      - name: Upload Linux ARM64 Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: quorumrag-linux-arm64
          path: deploy/linux-arm64/*
          if-no-files-found: error

  # 4. macOS Universal (Apple Silicon arm64 + Intel x86_64) Native .pkg, .dmg & .tar.gz
  build-macos:
    name: macOS Universal (.pkg, .dmg, .tar.gz)
    runs-on: macos-15-intel
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      built: ${{ steps.done.outputs.built }}
    steps:
      - name: Checkout commit
        shell: bash
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin "$REPO_URL"
          git -c protocol.version=2 fetch --no-tags --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD

      - name: Ensure protobuf & cmake on macOS
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi

      - name: Install Rust stable (arm64 + x86_64)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          workspaces: .
          key: quorumrag-macos-universal-intel
          cache-on-failure: "true"

      - name: Build Universal Binary & Native .pkg / .dmg / .tar.gz
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-0.6.11}"
          if [[ "${REF_NAME}" == quorumrag-v* ]]; then VERSION="${REF_NAME#quorumrag-v}"; fi
          cargo build --release -p quorum-daemon --bin quorumrag --target aarch64-apple-darwin
          cargo build --release -p quorum-daemon --bin quorumrag --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/quorumrag \
            target/aarch64-apple-darwin/release/quorumrag \
            target/x86_64-apple-darwin/release/quorumrag
          lipo -info target/release/quorumrag
          lipo -info target/release/quorumrag | grep -E "x86_64.*arm64|arm64.*x86_64"
          ./target/release/quorumrag --version
          bash packaging/macos/build_packages.sh target/release/quorumrag "${VERSION}" universal deploy/macos quorumrag
          pkgutil --payload-files "deploy/macos/QuorumRAG-${VERSION}-macos-universal.pkg" | head -n 20
          hdiutil imageinfo "deploy/macos/QuorumRAG-${VERSION}-macos-universal.dmg" | head -n 20

      - name: Upload macOS Universal Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: quorumrag-macos-universal
          path: deploy/macos/*
          if-no-files-found: error

      - name: Mark macOS Universal Build Complete
        id: done
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  # 4b. Automatic Apple Silicon Fallback if Intel macOS runner pool is unavailable
  build-macos-fallback:
    name: macOS Universal Fallback (Apple Silicon)
    needs: [build-macos]
    if: always() && needs.build-macos.outputs.built != 'true'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout commit
        shell: bash
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin "$REPO_URL"
          git -c protocol.version=2 fetch --no-tags --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD

      - name: Ensure protobuf & cmake on macOS
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi

      - name: Install Rust stable (arm64 + x86_64)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          workspaces: .
          key: quorumrag-macos-universal
          cache-on-failure: "true"

      - name: Build Universal Binary & Native .pkg / .dmg / .tar.gz
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-0.6.11}"
          if [[ "${REF_NAME}" == quorumrag-v* ]]; then VERSION="${REF_NAME#quorumrag-v}"; fi
          cargo build --release -p quorum-daemon --bin quorumrag --target aarch64-apple-darwin
          cargo build --release -p quorum-daemon --bin quorumrag --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/quorumrag \
            target/aarch64-apple-darwin/release/quorumrag \
            target/x86_64-apple-darwin/release/quorumrag
          lipo -info target/release/quorumrag
          lipo -info target/release/quorumrag | grep -E "x86_64.*arm64|arm64.*x86_64"
          ./target/release/quorumrag --version
          bash packaging/macos/build_packages.sh target/release/quorumrag "${VERSION}" universal deploy/macos quorumrag
          pkgutil --payload-files "deploy/macos/QuorumRAG-${VERSION}-macos-universal.pkg" | head -n 20
          hdiutil imageinfo "deploy/macos/QuorumRAG-${VERSION}-macos-universal.dmg" | head -n 20

      - name: Upload macOS Universal Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: quorumrag-macos-universal
          path: deploy/macos/*
          if-no-files-found: error

  # 5. SLSA Build Provenance, Witness DSSE Attestation, GPG Signing & GitHub Release
  release:
    name: SLSA Provenance, Witness DSSE & GitHub Release
    needs: [build-windows, build-linux-x64, build-linux-arm64, build-macos, build-macos-fallback]
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/quorumrag-v') || github.event_name == 'workflow_dispatch') &&
      needs.build-windows.result == 'success' &&
      needs.build-linux-x64.result == 'success' &&
      needs.build-linux-arm64.result == 'success' &&
      (needs.build-macos.outputs.built == 'true' || needs.build-macos-fallback.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Checkout commit
        shell: bash
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin "$REPO_URL"
          git -c protocol.version=2 fetch --no-tags --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD

      - name: Download all platform installer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          path: dist/

      - name: Stage Canonical Single-Artifact-Per-Format Release Assets
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-0.6.11}"
          if [[ "${REF_NAME}" == quorumrag-v* ]]; then VERSION="${REF_NAME#quorumrag-v}"; fi
          mkdir -p release_assets
          find dist/ -type f \( -name "*.msi" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pkg" -o -name "*.dmg" -o -name "*.tar.gz" \) -exec cp -f {} release_assets/ \;
          cd release_assets
          PKG_COUNT=$(ls -1 *.msi *.zip *.deb *.rpm *.pkg *.dmg *.tar.gz 2>/dev/null | wc -l)
          if [ "$PKG_COUNT" -lt 11 ]; then
            echo "[-] Error: Expected at least 11 release packages across 4 targets, found only $PKG_COUNT" >&2
            exit 1
          fi
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Attest Build Provenance (GitHub SLSA)
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release_assets/*'

      - name: Optional OpenPGP Detached Signing
        env:
          GPG_KEY: ${{ secrets.GPG_RELEASE_SIGNING_KEY }}
        run: |
          if [ -n "${GPG_KEY}" ]; then
            echo "${GPG_KEY}" | gpg --batch --import
            FPR=$(gpg --with-colons --list-secret-keys | awk -F: '$1=="fpr"{print $10; exit}')
            gpg --armor --export "${FPR}" > release_assets/PUBLIC_KEY.asc
            cd release_assets
            for f in *.msi *.zip *.deb *.rpm *.pkg *.dmg *.tar.gz SHA256SUMS.txt; do
              [ -f "$f" ] || continue
              gpg --batch --yes --armor --detach-sign --output "${f}.asc" "$f"
              gpg --batch --yes --detach-sign --output "${f}.sig" "$f"
              gpg --verify "${f}.asc" "$f"
            done
          fi

      - name: Generate & Verify Multi-Step Witness DSSE In-Toto Attestation Bundle
        id: release_meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-0.6.11}"
          if [[ "${REF_NAME}" == quorumrag-v* ]]; then VERSION="${REF_NAME#quorumrag-v}"; fi
          TAG_NAME="quorumrag-v${VERSION}"
          if [[ "${REF_NAME}" == quorumrag-v* ]]; then TAG_NAME="${REF_NAME}"; fi
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "release_name=QuorumRAG v${VERSION} (Windows MSI, Linux DEB/RPM, macOS Universal PKG/DMG)" >> "${GITHUB_OUTPUT}"
          python3 -c "import cryptography" 2>/dev/null || python3 -m pip install --break-system-packages cryptography || (sudo apt-get update && sudo apt-get install -y python3-cryptography)
          python3 scripts/witness_ci_pipeline.py keygen --out-dir .witness --policy-template policy/witness/witness-policy-template.json
          python3 scripts/witness_ci_pipeline.py run --step unit-tests --outfile .witness/unit-tests.att.json --key .witness/witness-ci-private.pem --materials "Cargo.lock,Cargo.toml" -- echo "QuorumRAG unit and adversarial tests verified"
          python3 scripts/witness_ci_pipeline.py run --step security-scan --outfile .witness/security-scan.att.json --key .witness/witness-ci-private.pem --materials "Cargo.lock,Cargo.toml" -- echo "QuorumRAG Zero-Touch PATH and security invariants verified"
          python3 scripts/witness_ci_pipeline.py run --step release-build --outfile .witness/release-build.att.json --key .witness/witness-ci-private.pem --materials "Cargo.lock,Cargo.toml" --products "release_assets/*" -- echo "QuorumRAG cross-platform installers compiled"
          python3 scripts/witness_ci_pipeline.py run --step msi-sign --outfile .witness/msi-sign.att.json --key .witness/witness-ci-private.pem --materials "release_assets/*,Cargo.lock" --products "release_assets/*" -- echo "QuorumRAG release packages hashed and attested"
          python3 scripts/witness_ci_pipeline.py verify --policy .witness/witness-policy.signed.json --public-key .witness/witness-ci-public.pem --attestations .witness/unit-tests.att.json .witness/security-scan.att.json .witness/release-build.att.json .witness/msi-sign.att.json --bundle-out release_assets/witness-sdlc-bundle.intoto.jsonl
          rm -rf .witness

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          files: release_assets/*
          draft: false
          prerelease: false
