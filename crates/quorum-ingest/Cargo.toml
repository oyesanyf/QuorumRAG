[package]
name = "quorum-ingest"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "High-capacity filesystem ingestion, real-time watcher, Magika classification, image indexing, deduplication, reindex & drift engine"

[dependencies]
# Internal workspace crates
quorum-types = { workspace = true }
quorum-classifier = { workspace = true }
quorum-contract = { workspace = true }
quorum-storage = { workspace = true }

# Traversal & OS Watching
ignore = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
walkdir = { workspace = true }

# Concurrency & Async
tokio = { workspace = true }
futures = { workspace = true }
rayon = "1.10"

# Cryptography & Serialization
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

tempfile = { workspace = true }

# Error Handling & Tracing
thiserror = { workspace = true }
tracing = { workspace = true }

# OLE2, ZIP/OOXML, PDF FlateDecode & SQLite Native Document Parsing
cfb = "0.7"
flate2 = "1.1"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
