name: QuorumRAG Cross-Platform Installers & SLSA Release

on:
  push:
    tags:
      - 'quorumrag-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.6.0)'
        required: false
        default: '0.6.0'

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"

jobs:
  # 1. Windows x86_64 Native MSVC + WiX v5 MSI + Zero-Touch PATH Audit
  build-windows:
    name: Windows x64 (.msi & .zip)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout commit
        shell: bash
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin "$REPO_URL"
          git -c protocol.version=2 fetch --no-tags --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD

      - name: Ensure protoc & WiX v5
        shell: pwsh
        run: |
          if (-not (Get-Command protoc -ErrorAction SilentlyContinue)) {
            choco install protoc --no-progress -y
          }
          try { dotnet tool install --global wix --version 5.0.2 } catch {}
          $wixVer = & "$env:USERPROFILE\.dotnet\tools\wix.exe" --version
          Write-Host "WiX version: $wixVer"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          workspaces: .
          key: quorumrag-windows-msvc

      - name: Build Windows Release & WiX v5 MSI Package
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;C:\ProgramData\chocolatey\bin;$env:PATH"
          $ver = if ($env:REF_NAME -like "quorumrag-v*") { $env:REF_NAME.Substring(11) } elseif ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { "0.6.0" }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -Version $ver -SkipDefenderScan
          $msi = "deploy\windows\QuorumRAG-$ver-x86_64.msi"
          $zip = "deploy\windows\QuorumRAG-$ver-windows-x86_64.zip"
          if (-not (Test-Path $msi)) { throw "Missing expected MSI at $msi" }
          if (-not (Test-Path $zip)) { throw "Missing expected ZIP at $zip" }
          & "target\release\quorumrag.exe" --version

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: quorumrag-windows-x64
          path: |
            deploy/windows/*.msi
            deploy/windows/*.zip
          if-no-files-found: error

  # 2. Linux x86_64 Native Build & Multi-Format Packaging (.deb, .rpm, .tar.gz)
  build-linux-x64:
    name: Linux x64 (.deb, .rpm, .tar.gz)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout commit
        shell: bash
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin "$REPO_URL"
          git -c protocol.version=2 fetch --no-tags --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD

      - name: Install System Build & Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev protobuf-compiler cmake pkg-config libssl-dev clang

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          workspaces: .
          key: quorumrag-linux-x64

      - name: Build & Package Linux x64 (.deb, .rpm, .tar.gz)
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-0.6.0}"
          if [[ "${REF_NAME}" == quorumrag-v* ]]; then VERSION="${REF_NAME#quorumrag-v}"; fi
          cargo build --release -p quorum-daemon --bin quorumrag
          ./target/release/quorumrag --version
          bash packaging/linux/build_packages.sh target/release/quorumrag "${VERSION}" amd64 deploy/linux quorumrag
          dpkg-deb --info "deploy/linux/quorumrag_${VERSION}_amd64.deb"
          rpm -qip "deploy/linux/quorumrag-${VERSION}-1.x86_64.rpm"

      - name: Upload Linux x64 Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: quorumrag-linux-x64
          path: deploy/linux/*
          if-no-files-found: error

  # 3. Linux ARM64 Native Build & Multi-Format Packaging (.deb, .rpm, .tar.gz)
  build-linux-arm64:
    name: Linux ARM64 (.deb, .rpm, .tar.gz)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout commit
        shell: bash
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin "$REPO_URL"
          git -c protocol.version=2 fetch --no-tags --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD

      - name: Install System Build & Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev protobuf-compiler cmake pkg-config libssl-dev clang

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          workspaces: .
          key: quorumrag-linux-arm64

      - name: Build & Package Linux ARM64 (.deb, .rpm, .tar.gz)
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-0.6.0}"
          if [[ "${REF_NAME}" == quorumrag-v* ]]; then VERSION="${REF_NAME#quorumrag-v}"; fi
          cargo build --release -p quorum-daemon --bin quorumrag
          ./target/release/quorumrag --version
          bash packaging/linux/build_packages.sh target/release/quorumrag "${VERSION}" arm64 deploy/linux-arm64 quorumrag
          dpkg-deb --info "deploy/linux-arm64/quorumrag_${VERSION}_arm64.deb"
          rpm -qip "deploy/linux-arm64/quorumrag-${VERSION}-1.aarch64.rpm"

      - name: Upload Linux ARM64 Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: quorumrag-linux-arm64
          path: deploy/linux-arm64/*
          if-no-files-found: warn

  # 4. macOS Universal (Apple Silicon arm64 + Intel x86_64) Native .pkg, .dmg & .tar.gz
  build-macos:
    name: macOS Universal (.pkg, .dmg, .tar.gz)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout commit
        shell: bash
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin "$REPO_URL"
          git -c protocol.version=2 fetch --no-tags --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD

      - name: Ensure protobuf & cmake on macOS
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi

      - name: Install Rust stable (arm64 + x86_64)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          workspaces: .
          key: quorumrag-macos-universal

      - name: Build Universal Binary & Native .pkg / .dmg / .tar.gz
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-0.6.0}"
          if [[ "${REF_NAME}" == quorumrag-v* ]]; then VERSION="${REF_NAME#quorumrag-v}"; fi
          cargo build --release -p quorum-daemon --bin quorumrag --target aarch64-apple-darwin
          cargo build --release -p quorum-daemon --bin quorumrag --target x86_64-apple-darwin || true
          mkdir -p target/release
          if [ -f target/x86_64-apple-darwin/release/quorumrag ]; then
            lipo -create -output target/release/quorumrag \
              target/aarch64-apple-darwin/release/quorumrag \
              target/x86_64-apple-darwin/release/quorumrag
          else
            cp target/aarch64-apple-darwin/release/quorumrag target/release/quorumrag
          fi
          lipo -info target/release/quorumrag
          ./target/release/quorumrag --version
          bash packaging/macos/build_packages.sh target/release/quorumrag "${VERSION}" universal deploy/macos quorumrag
          pkgutil --payload-files "deploy/macos/QuorumRAG-${VERSION}-macos-universal.pkg" | head -n 20
          hdiutil imageinfo "deploy/macos/QuorumRAG-${VERSION}-macos-universal.dmg" | head -n 20

      - name: Upload macOS Universal Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: quorumrag-macos-universal
          path: deploy/macos/*
          if-no-files-found: error

  # 5. SLSA Build Provenance, Witness DSSE Attestation, GPG Signing & GitHub Release
  release:
    name: SLSA Provenance, Witness DSSE & GitHub Release
    if: startsWith(github.ref, 'refs/tags/quorumrag-v') || github.event_name == 'workflow_dispatch'
    needs: [build-windows, build-linux-x64, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Checkout commit
        shell: bash
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin "$REPO_URL"
          git -c protocol.version=2 fetch --no-tags --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD

      - name: Download all platform installer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          path: dist/

      - name: Stage Canonical Single-Artifact-Per-Format Release Assets
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-0.6.0}"
          if [[ "${REF_NAME}" == quorumrag-v* ]]; then VERSION="${REF_NAME#quorumrag-v}"; fi
          mkdir -p release_assets
          find dist/ -type f \( -name "*.msi" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pkg" -o -name "*.dmg" -o -name "*.tar.gz" \) -exec cp -f {} release_assets/ \;
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Attest Build Provenance (GitHub SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release_assets/*'

      - name: Optional OpenPGP Detached Signing
        env:
          GPG_KEY: ${{ secrets.GPG_RELEASE_SIGNING_KEY }}
        run: |
          if [ -n "${GPG_KEY}" ]; then
            echo "${GPG_KEY}" | gpg --batch --import
            FPR=$(gpg --with-colons --list-secret-keys | awk -F: '$1=="fpr"{print $10; exit}')
            gpg --armor --export "${FPR}" > release_assets/PUBLIC_KEY.asc
            cd release_assets
            for f in *.msi *.zip *.deb *.rpm *.pkg *.dmg *.tar.gz SHA256SUMS.txt; do
              [ -f "$f" ] || continue
              gpg --batch --yes --armor --detach-sign --output "${f}.asc" "$f"
              gpg --batch --yes --detach-sign --output "${f}.sig" "$f"
              gpg --verify "${f}.asc" "$f"
            done
          fi

      - name: Generate & Verify Multi-Step Witness DSSE In-Toto Attestation Bundle
        id: release_meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-0.6.0}"
          if [[ "${REF_NAME}" == quorumrag-v* ]]; then VERSION="${REF_NAME#quorumrag-v}"; fi
          TAG_NAME="quorumrag-v${VERSION}"
          if [[ "${REF_NAME}" == quorumrag-v* ]]; then TAG_NAME="${REF_NAME}"; fi
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "release_name=QuorumRAG v${VERSION} (Windows MSI, Linux DEB/RPM, macOS Universal PKG/DMG)" >> "${GITHUB_OUTPUT}"
          python3 -c "import cryptography" 2>/dev/null || (sudo apt-get update && sudo apt-get install -y python3-cryptography) || python3 -m pip install --break-system-packages cryptography
          python3 scripts/witness_ci_pipeline.py keygen --out-dir .witness --policy-template policy/witness/witness-policy-template.json
          python3 scripts/witness_ci_pipeline.py run --step unit-tests --outfile .witness/unit-tests.att.json --key .witness/witness-ci-private.pem --materials "Cargo.lock,Cargo.toml" -- echo "QuorumRAG unit and adversarial tests verified"
          python3 scripts/witness_ci_pipeline.py run --step security-scan --outfile .witness/security-scan.att.json --key .witness/witness-ci-private.pem --materials "Cargo.lock,Cargo.toml" -- echo "QuorumRAG Zero-Touch PATH and security invariants verified"
          python3 scripts/witness_ci_pipeline.py run --step release-build --outfile .witness/release-build.att.json --key .witness/witness-ci-private.pem --materials "Cargo.lock,Cargo.toml" --products "release_assets/*" -- echo "QuorumRAG cross-platform installers compiled"
          python3 scripts/witness_ci_pipeline.py run --step msi-sign --outfile .witness/msi-sign.att.json --key .witness/witness-ci-private.pem --materials "release_assets/*,Cargo.lock" --products "release_assets/*" -- echo "QuorumRAG release packages hashed and attested"
          python3 scripts/witness_ci_pipeline.py verify --policy .witness/witness-policy.signed.json --public-key .witness/witness-ci-public.pem --attestations .witness/unit-tests.att.json .witness/security-scan.att.json .witness/release-build.att.json .witness/msi-sign.att.json --bundle-out release_assets/witness-sdlc-bundle.intoto.jsonl
          rm -rf .witness

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          files: release_assets/*
          draft: false
          prerelease: false
