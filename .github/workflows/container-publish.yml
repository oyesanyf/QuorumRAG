name: QuorumRAG Container Package (GHCR)

# Publishes the multi-arch container image ghcr.io/oyesanyf/quorumrag (GitHub Packages)
# from the prebuilt Linux x64 + ARM64 binaries attached to a QuorumRAG GitHub Release.
# Runs automatically after the installer/release workflow succeeds for a quorumrag-v* tag,
# or on demand for any existing release tag.

on:
  workflow_run:
    workflows: ["QuorumRAG Cross-Platform Installers & SLSA Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package (e.g. quorumrag-v0.1.0)'
        required: true
        default: 'quorumrag-v0.1.0'

permissions: read-all

jobs:
  publish-container:
    name: Publish ghcr.io/oyesanyf/quorumrag
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'quorumrag-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve release tag and version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$RUN_TAG}"
          case "$TAG" in
            quorumrag-v*) ;;
            *) echo "::error::Not a QuorumRAG release tag: '$TAG'"; exit 1 ;;
          esac
          VERSION="${TAG#quorumrag-v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quorumrag" >> "$GITHUB_OUTPUT"

      - name: Download prebuilt Linux binaries from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dl bin/amd64 bin/arm64
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl \
            --pattern "quorumrag-${VERSION}-linux-x86_64.tar.gz" \
            --pattern "quorumrag-${VERSION}-linux-aarch64.tar.gz"
          tar -xzf "dl/quorumrag-${VERSION}-linux-x86_64.tar.gz" -C dl
          tar -xzf "dl/quorumrag-${VERSION}-linux-aarch64.tar.gz" -C dl
          cp "dl/quorumrag-${VERSION}-linux-x86_64/quorumrag" bin/amd64/quorumrag
          cp "dl/quorumrag-${VERSION}-linux-aarch64/quorumrag" bin/arm64/quorumrag
          chmod 755 bin/*/quorumrag
          file bin/amd64/quorumrag bin/arm64/quorumrag
          cp packaging/docker/Dockerfile Dockerfile.release

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Smoke-test the amd64 image before publishing
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load \
            --build-arg VERSION="${VERSION}" -f Dockerfile.release -t quorumrag:smoke .
          docker run --rm quorumrag:smoke --version
          docker run -d --name qr_smoke -p 3031:3031 quorumrag:smoke
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3031/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          docker logs qr_smoke 2>&1 | tail -n 40 || true
          docker rm -f qr_smoke >/dev/null 2>&1 || true
          if [ "$ok" != "1" ]; then echo "::error::Container health check failed"; exit 1; fi
          echo "[+] Container answered /api/health"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attest container provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
