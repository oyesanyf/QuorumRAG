name: QuorumRAG Solo-Dev Invariant Gate & Auto Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: read-all

jobs:
  auto-review:
    name: QuorumRAG Security Invariant Gate & Peer Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout commit
        shell: bash
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin "$REPO_URL"
          git -c protocol.version=2 fetch --no-tags --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD

      - name: Verify QuorumRAG PR Invariants & Approve
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Inspecting PR #${PR_NUMBER} by @${PR_AUTHOR} (${PR_ASSOCIATION}, ref: ${PR_HEAD_REF})..."

          FILES_JSON=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100")
          TOUCHES_QUORUM=$(echo "${FILES_JSON}" | jq -r '.[].filename' | grep -E '.' || true)
          if [ -z "${TOUCHES_QUORUM}" ]; then
            echo "PR does not touch QuorumRAG paths; skipping QuorumRAG gate."
            exit 0
          fi

          FILE_COUNT=$(echo "${FILES_JSON}" | jq 'length')
          echo "Changed files count: ${FILE_COUNT}"

          # Security Invariant 1: Block private key files (.pem, .pfx, .key, .p12)
          FORBIDDEN_KEYS=$(echo "${FILES_JSON}" | jq -r '.[].filename' | grep -E '\.(pem|pfx|key|p12)$' || true)
          if [ -n "${FORBIDDEN_KEYS}" ]; then
            echo "::error::Forbidden private key material detected in PR: ${FORBIDDEN_KEYS}"
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" \
              --body "[FAIL] QuorumRAG Security Invariant 1 Failed: Forbidden private key material detected in PR (${FORBIDDEN_KEYS})."
            exit 1
          fi

          # Security Invariant 2: Strict Zero-Touch PATH & Environment Law
          WIX_PATCHES=$(echo "${FILES_JSON}" | jq -r '.[] | select(.filename | endswith(".wxs")) | .patch // empty')
          if echo "${WIX_PATCHES}" | grep -E '^\+' | grep -Ev '^\+\s*<!--' | grep -Ei '<\s*Environment\b' >/dev/null 2>&1; then
            echo "::error::Zero-Touch PATH violation: <Environment> element detected in WiX manifest."
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" \
              --body "[FAIL] QuorumRAG Security Invariant 2 Failed: WiX manifest contains forbidden WiX Environment tag. Installers must strictly obey Zero-Touch PATH law."
            exit 1
          fi

          SCRIPT_PATCHES=$(echo "${FILES_JSON}" | jq -r '.[] | select(.filename | test("\\.(ps1|cmd|bat)$")) | .patch // empty')
          if echo "${SCRIPT_PATCHES}" | grep -E '^\+' | grep -Ev '^\+\s*(#|REM\b|::)' | grep -Ei '(SetEnvironmentVariable\([^)]*(User|Machine)|HKCU\\Environment|HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Environment|\bsetx\s+)' >/dev/null 2>&1; then
            echo "::error::Zero-Touch PATH violation: User/Machine environment mutation detected in script."
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" \
              --body "[FAIL] QuorumRAG Security Invariant 2 Failed: Persistent User/Machine environment mutation detected in packaging script."
            exit 1
          fi

          # Security Invariant 3: Cargo build.rs Supply-Chain Execution Guard
          BUILD_RS_PATCHES=$(echo "${FILES_JSON}" | jq -r '.[] | select(.filename | endswith("build.rs")) | .patch // empty')
          if echo "${BUILD_RS_PATCHES}" | grep -E '^\+.*(TcpStream::connect|reqwest::|Invoke-WebRequest|curl\s+http|169\.254\.169\.254)' >/dev/null 2>&1; then
            echo "::error::Unauthorized network or IMDS call detected in build.rs patch."
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" \
              --body "[FAIL] QuorumRAG Security Invariant 3 Failed: Unauthorized network/IMDS call detected in build.rs."
            exit 1
          fi

          # Security Invariant 4: Fail closed on workflow privilege escalation
          WORKFLOW_PATCHES=$(echo "${FILES_JSON}" | jq -r '.[] | select(.filename | startswith(".github/workflows/")) | .patch // empty')
          if echo "${WORKFLOW_PATCHES}" | grep -E '^\+.*(permissions:\s*write-all|persist-credentials:\s*true|curl.*SECRETS|wget.*GITHUB_TOKEN)' >/dev/null 2>&1; then
            echo "::error::Unauthorized workflow privilege escalation pattern detected."
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" \
              --body "[FAIL] QuorumRAG Security Invariant 4 Failed: Unauthorized workflow privilege escalation pattern detected."
            exit 1
          fi

          # Security Invariant 5: Self-Approval & Workflow Tampering Guard
          CRITICAL_MODIFICATIONS=$(echo "${FILES_JSON}" | jq -r '.[].filename' | grep -E '^(\.github/workflows/|policy/)' || true)
          if [ -n "${CRITICAL_MODIFICATIONS}" ]; then
            IS_OWNER=false
            if [ "${PR_AUTHOR}" = "oyesanyf" ] && [ "${PR_ASSOCIATION}" = "OWNER" ] && [ "${PR_HEAD_REPO}" = "${REPO}" ]; then
              IS_OWNER=true
            fi
            IS_SOLO_BRANCH=false
            if [[ "${PR_HEAD_REF}" == pr/solo-quorumrag-* ]] || [[ "${PR_HEAD_REF}" == pr/solo-* ]]; then
              IS_SOLO_BRANCH=true
            fi
            if [ "${IS_OWNER}" != "true" ] || [ "${IS_SOLO_BRANCH}" != "true" ]; then
              echo "::notice::Manual review required for critical QuorumRAG workflow/policy modifications."
              exit 0
            fi
          fi

          echo "[PASS] All QuorumRAG security invariants verified."

          if [ "${PR_AUTHOR}" = "oyesanyf" ] || [ "${PR_AUTHOR}" = "dependabot[bot]" ] || [ "${PR_ASSOCIATION}" = "OWNER" ] || [ "${PR_ASSOCIATION}" = "MEMBER" ] || [ "${PR_ASSOCIATION}" = "COLLABORATOR" ]; then
            gh pr review "${PR_NUMBER}" --repo "${REPO}" --approve \
              --body "[PASS] QuorumRAG Invariant Gate & Review Bot: Verified contributor (@${PR_AUTHOR}, ${PR_ASSOCIATION}), commit ${PR_HEAD_SHA} (${FILE_COUNT} file(s)), Zero-Touch PATH compliance, zero private keys, and hermetic build scripts." || true
            gh pr merge "${PR_NUMBER}" --repo "${REPO}" --squash || gh pr merge "${PR_NUMBER}" --repo "${REPO}" --auto --squash || true
          fi
